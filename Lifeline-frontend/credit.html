<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malkia Pauline's Ledger System - Credit Book</title>
  
  <link rel="stylesheet" href="lifeline.css">
  <script src="lifeline.js"></script>
</head>
<body>

  
 <nav>
    <a href="index.html">Dashboard</a>
    <a href="sales.html">Checkout</a>
    <a href="credit.html">Credit Book</a>
</nav>


  <main>
    <h1>Debtor's Record Book</h1>

    <form id="creditForm">
      
      <div>
        <label>Customer Name</label>
        <input type="text" id="customerName" placeholder="e.g. Lucy Wanjiru" required>
      </div>

      <div>
        <label>Total Value Owed (Ksh)</label>
        <input type="number" id="amountOwed" step="10.00" placeholder="0.00" required>
      </div>

      <div>
        <label>Items Borrowed</label>
        <input type="text" id="itemsBorrowed" placeholder="e.g. 2kg Flour, 5 Sweets" required>
      </div>


      <button type="submit">Record Debt Entry</button>
    </form>

    <h2>Outstanding Debts Ledger</h2>
    <table>
      <thead>
        <tr>
          <th>Customer Name</th>
          <th>Items Taken</th>
          <th>Amount Owed</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="creditsTableBody">
        
      </tbody>
    </table>
  </main>
</body>
