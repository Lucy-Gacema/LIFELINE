<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malkia Pauline's Ledger System - Checkout</title>
  <link rel="stylesheet" href="lifeline.css">
  <script src="lifeline.js"></script>
</head>
<body>
 <nav>
    <a href="index.html">Dashboard</a>
    <a href="sales.html">Checkout</a>
    <a href="credit.html">Credit Book</a>
</nav>

  <main>
    <h1>Register a Cash Sale</h1>

    <form id="salesForm">
      <div>
        <label>Select Product</label>
        <select id="productSelect" required>
        </select>
      </div>
      <div>
        <label>Quantity Sold</label>
        <input type="number" id="quantityInput" min="1" value="1" required>
      </div>

      <button type="submit">Log Cash Sale</button>
    </form>
    <h2>Today's Sales Records</h2>
    <table>
      <thead>
        <tr>
          <th>Product ID</th>
          <th>Units Sold</th>
          <th>Profit Realized</th>
        </tr>
      </thead>
      <tbody id="salesTableBody">
      </tbody>
    </table>
  </main>

</body>
</html>
